<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Flask tutorial</title>
</head>
<body>
    {% if is_logged_in %}
    <h1>Welcome back!</h1>
    {% else %}
    <h1>Welcome Guest!</h1>
    {% endif %}

    {% if marks >= 90 %}
    <h1>Grade A</h1>
    {% elif marks >= 80 %}
    <h1>Grade B</h1>
    {% elif marks >= 70 %}
    <h1>Grade C</h1>
    {% else %}
    <h1>Fail</h1>
    {% endif %}
</body>
</html>
