<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Flask tutorial</title>
</head>
<body>
    <ul>
        {% for course in courses %}
        <li>{{loop.index}} {{course}}</li>
        {% endfor %}
    </ul>
    <br>
    <ul>
        {% for key,value in student.items() %}
        <li>{{ key }}  {{ value }}</li>
        {% endfor %}
    </ul>

</body>
</html>
